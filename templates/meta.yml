# Рабочая опись присланных материалов: что получено и чего не хватает.
# Источником для сборки НЕ является — страница и документы собираются
# из output/press-release.md и page.json. Этот файл нужен, чтобы не
# додумывать: сюда выписываются факты как есть и открытые вопросы.
slug: artist-release-name
artist: "[УТОЧНИТЬ]"
release_title: "[УТОЧНИТЬ]"
format: "[УТОЧНИТЬ]"        # сингл / EP / альбом
genre: "[УТОЧНИТЬ]"         # если не прислан, классификацию пометить как свою
release_date: "[УТОЧНИТЬ]"  # ДД.ММ.ГГГГ

composers: []
participants: []            # исполнители, продюсер, звукорежиссёр, автор обложки

quote_artist: "[ЦИТАТА]"    # собственная цитата артиста
press: []                   # цитаты прессы: text + source

links:
  streaming_all: "[УТОЧНИТЬ]"
  release_page: "[УТОЧНИТЬ]"
  bandcamp_album: "[УТОЧНИТЬ]"
  bandcamp_embed_id: "[УТОЧНИТЬ]"
  artist: {}

cover: "[УТОЧНИТЬ]"         # файл обложки; в документы вкладывается только локальный

press_contacts:
  email: mail@fancymusic.ru
  telegram: "@s_krasin"

checklist:                  # чеклист выпуска
  release_info: false       # информация о релизе RU/EN: название, ссылка, описание, аннотация, выходные данные
  metadata: false           # треклист, точные имена исполнителей, авторов, композиторов
  masters: false            # финальные мастер-файлы всех треков
  cover: false              # обложка релиза, файл
  distribution: false       # загрузка в дистрибьюцию (стриминги)
  bandcamp: false
  site: false
  server_archives: false    # архивы с музыкой на сервер
  promo:
    texts: false            # промо-тексты: пишем сами
    artist_photo: false     # фото артистов, файл + автор фото
  promo_content: false      # контент для промо: фото и видео об артистах и альбоме, оживлённая обложка
  press_release: false      # собирается в отдельной ветке чата: скилл press-release, страница docs/releases/{slug}
