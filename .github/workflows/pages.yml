name: Публикация пресс-релизов на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'brand/design-tokens.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # токены живут в brand/, на Pages уезжает их копия
      - run: ./tools/sync-tokens.sh

      # enablement: true включает Pages, если он ещё не включён в репозитории
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
