<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Пиктограммы 24×24, монохромные, рисуются currentColor.
       Там, где фирменный знак сам по себе геометричный (Telegram, Instagram,
       Bandcamp, Spotify), взята его форма. Для VK и Facebook — буквенный знак
       в круге: рисовать их логотипы по памяти означало бы соврать в деталях. -->

  <symbol id="i-tg" viewBox="0 0 24 24">
    <path fill="currentColor" d="M21.7 3.3 2.9 10.6c-1 .4-1 1.2 0 1.5l4.7 1.5 1.8 5.5c.2.6.4.8 1 .3l2.6-2.4 4.9 3.6c.9.5 1.4.2 1.6-.8L22.9 4.5c.2-1-.3-1.5-1.2-1.2ZM8.9 13.3l9.5-6c.4-.3.8-.1.5.2l-8 7.3-.3 3.3-1.7-4.8Z"/>
  </symbol>

  <symbol id="i-ig" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.2" cy="6.8" r="1.3" fill="currentColor"/>
  </symbol>

  <symbol id="i-bc" viewBox="0 0 24 24">
    <path fill="currentColor" d="M9.2 5h11.6l-5.9 14H3.3L9.2 5Z"/>
  </symbol>

  <symbol id="i-sp" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          d="M7 9.4c3.3-.9 6.7-.6 9.6 1M7.6 12.6c2.7-.7 5.5-.4 7.9.9M8.2 15.7c2.1-.5 4.3-.3 6.2.7"/>
  </symbol>

  <symbol id="i-web" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path fill="none" stroke="currentColor" stroke-width="1.8" d="M3.4 9h17.2M3.4 15h17.2"/>
  </symbol>

  <symbol id="i-mail" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path fill="none" stroke="currentColor" stroke-width="1.8" d="m3 6.5 9 6.5 9-6.5"/>
  </symbol>

  <symbol id="i-vk" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <text x="12" y="16.3" text-anchor="middle" fill="currentColor"
          font-family="Bebas Neue, Impact, sans-serif" font-size="10.5" letter-spacing=".3">VK</text>
  </symbol>

  <symbol id="i-fb" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <text x="12" y="16.6" text-anchor="middle" fill="currentColor"
          font-family="Bebas Neue, Impact, sans-serif" font-size="11">F</text>
  </symbol>

  <symbol id="i-yt" viewBox="0 0 24 24">
    <rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path fill="currentColor" d="M10.2 8.8v6.4L15.6 12l-5.4-3.2Z"/>
  </symbol>

  <symbol id="i-doc" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.8"
          d="M14 2.5H6.5A1.5 1.5 0 0 0 5 4v16a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 20V7.5L14 2.5Z"/>
    <path fill="none" stroke="currentColor" stroke-width="1.8" d="M13.8 2.6V8h5.1"/>
  </symbol>

  <symbol id="i-download" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 19.5h16"/>
